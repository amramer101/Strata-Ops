name: DevSecOps CI Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/7-Azure-CICD-Migration.yml'
      - '7-Azure-Lift-Shift-with-CICD-Migration/userdata-VMs/**'
  workflow_dispatch:

jobs:
  # (Security Scans)
  security-scans:
    name: TruffleHog & Checkov Scans
    runs-on: ubuntu-latest
    steps:

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # TruffleHog
          fetch-depth: 0 

      - name: Secret Scanning with TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

      # Terraform (Infrastructure as Code) 
      - name: IaC Security Scan with Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform 
          soft_fail: false

  # 2. (Build)
  build-application:
    name: Maven Build
    needs: security-scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven 

      - name: Build with Maven
        run: mvn clean package -DskipTests
        
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-artifact
          path: target/*.war

  # 3. (Deployment)
  deploy-to-tomcat:
    name: Deploy WAR to Azure App VM
    needs: build-application
    runs-on: ubuntu-latest
    steps:

      # 1. Download Artifact
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-artifact
          path: target/

      # 2. SCP WAR file to Azure VM
      - name: SCP WAR file to Azure VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          source: "target/*.war"
          target: "/tmp/"
          strip_components: 1 

      - name: SSH and Restart Tomcat
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            echo "Deploying new WAR file to Tomcat..."
            sudo systemctl stop tomcat10 || true
            sudo rm -rf /opt/tomcat10/webapps/ROOT /opt/tomcat10/webapps/ROOT.war
            
            sudo cp /tmp/*.war /opt/tomcat10/webapps/ROOT.war
            
            sudo chown tomcat:tomcat /opt/tomcat10/webapps/ROOT.war
            sudo systemctl start tomcat10
            echo "Deployment Successfully Completed"          