name: DevSecOps CI Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/7-Azure-CICD-Migration.yml'
      - '7-Azure-Lift-Shift-with-CICD-Migration/userdata-VMs/**'
  workflow_dispatch:

jobs:
  # (Security Scans)
  security-scans:
    name: TruffleHog & Checkov Scans
    runs-on: ubuntu-latest
    steps:

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Secret Scanning with TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --debug --only-verified
          
      # Terraform (Infrastructure as Code) 
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov for Terraform
        uses: bridgecrewio/checkov-action@master
        with:
           directory: 7-Azure-Lift-Shift-with-CICD-Migration/terraform/
           framework: terraform
           soft_fail: true 
           output_format: cli

  # 2. (Build)
  build-application:
    name: Maven Build
    needs: security-scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven 

      - name: Build with Maven
        run: mvn clean package -DskipTests
        
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-artifact
          path: target/*.war

  # 3. (Deployment)
  deploy-to-tomcat:
    name: Deploy WAR to Azure App VM
    needs: build-application
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-artifact
          path: target/

      # Service Principal
      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Fetch Secrets from Key Vault (DB creds, VM IPs, SSH keys)
      - name: Fetch Secrets from Key Vault
        uses: Azure/get-keyvault-secrets@v1
        id: kv
        with:
          keyvault: "eprofile-kv-weurope-01"
          secrets: 'tomcat-private-ip, nginx-public-ip, vm-username, vm-ssh-key'

      # SCP the WAR file to the Tomcat VM using the fetched secrets
      - name: SCP WAR file to Azure VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.kv.outputs.tomcat-private-ip }}
          username: ${{ steps.kv.outputs.vm-username }}
          key: ${{ steps.kv.outputs.vm-ssh-key }}
          proxy_host: ${{ steps.kv.outputs.nginx-public-ip }}
          proxy_username: ${{ steps.kv.outputs.vm-username }}
          proxy_key: ${{ steps.kv.outputs.vm-ssh-key }}
          source: "target/*.war"
          target: "/tmp/"
          strip_components: 1 

      # SSH into the VM and restart Tomcat to pick up the new WAR
      - name: SSH and Restart Tomcat
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.kv.outputs.tomcat-private-ip }}
          username: ${{ steps.kv.outputs.vm-username }}
          key: ${{ steps.kv.outputs.vm-ssh-key }}
          proxy_host: ${{ steps.kv.outputs.nginx-public-ip }}
          proxy_username: ${{ steps.kv.outputs.vm-username }}
          proxy_key: ${{ steps.kv.outputs.vm-ssh-key }}
          script: |
            echo "Deploying new WAR file to Tomcat..."
            sudo systemctl stop tomcat10 || true
            sudo rm -rf /opt/tomcat10/webapps/ROOT /opt/tomcat10/webapps/ROOT.war
            sudo cp /tmp/*.war /opt/tomcat10/webapps/ROOT.war
            sudo chown tomcat:tomcat /opt/tomcat10/webapps/ROOT.war
            sudo systemctl start tomcat10
            echo "Deployment Successfully Completed"